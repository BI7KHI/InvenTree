{% load report %}{% load inventree_extras %}{% load barcode %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    {{ page_style|safe }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font-family: 'DejaVu Sans', Arial, sans-serif; }
    .label {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center; overflow: hidden;
    }
    .name { font-size: 3.2mm; font-weight: bold; line-height: 1.2; }
    .ipn { font-size: 2.6mm; line-height: 1.2; }
    .desc { font-size: 2mm; color: #555; line-height: 1.2; }
    .qr { width: 9mm; height: 9mm; margin-top: 1mm; }
</style>
</head>
<body>
<div class="label">
    <div class="name">{{ part.name }}</div>
    {% if part.IPN %}<div class="ipn">{{ part.IPN }}</div>{% endif %}
    {% if part.description %}<div class="desc">{{ part.description }}</div>{% endif %}
    {% if part.IPN %}<img class="qr" alt="QR" src="{% qrcode part.IPN border=1 box_size=4 %}">{% endif %}
</div>
</body>
</html>

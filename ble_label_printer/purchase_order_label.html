{% load report %}{% load inventree_extras %}{% load barcode %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    {{ page_style|safe }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font-family: 'DejaVu Sans', Arial, sans-serif; }
    .label { width: 100%; height: 100%; display: flex; flex-direction: column; border: 0.4mm solid #1a1a1a; overflow: hidden; }
    .head { padding: 1.1mm 1.5mm; font-size: 3.2mm; font-weight: bold; text-align: center; border-bottom: 0.35mm solid #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body { flex: 1; display: flex; align-items: center; }
    .info { flex: 1; min-width: 0; padding: 1.5mm; font-size: 2.3mm; line-height: 1.5; overflow: hidden; }
    .info .line { display: flex; gap: 1mm; }
    .info .k { color: #444; flex-shrink: 0; }
    .info .v { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qrc { flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 1.5mm; }
    .qrc img { width: 12mm; height: 12mm; }
    .foot { padding: 0.6mm 1.5mm; font-size: 1.9mm; text-align: center; border-top: 0.35mm solid #1a1a1a; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="label">
  <div class="head">采购单 {{ order.reference }}</div>
  <div class="body">
    <div class="info">
      {% if supplier %}<div class="line"><span class="k">供应商</span><span class="v">{{ supplier.name }}</span></div>{% endif %}
      {% if order.description %}<div class="line"><span class="k">描述</span><span class="v">{{ order.description }}</span></div>{% endif %}
      {% if order.target_date %}<div class="line"><span class="k">交期</span><span class="v">{{ order.target_date }}</span></div>{% endif %}
    </div>
    <div class="qrc"><img alt="QR" src="{% qrcode order.barcode border=1 box_size=4 %}"></div>
  </div>
  <div class="foot">{{ order.reference }}</div>
</div>
</body>
</html>
